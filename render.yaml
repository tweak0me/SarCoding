services:
  - type: web
    name: sarcoding
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: PUBLIC_TELEGRAM
        value: https://t.me/
      - key: LOG_LEVEL
        value: INFO
